name: swot-internal-wave

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip

  - numpy=2.4.6
  - scipy=1.17.1
  - xarray=2026.4.0
  - netcdf4=1.7.4
  - matplotlib=3.11.0
  - pillow=12.3.0

  # YOLO can run inference on CPU.
  - pytorch-cpu=2.13
  - torchvision=0.28

  - pip:
      - ultralytics==8.4.89
      - fastapi==0.138.1
      - "uvicorn[standard]==0.49.0"
      - httpx