name: Build and publish Docker image

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cnguye-n/swot-internal-wave-ml-yolo

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # Get the repository code.
      - name: Checkout repository
        uses: actions/checkout@v6

      # Create a Buildx builder.
      # This is needed for BuildKit features such as the
      # GitHub Actions cache backend used below.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Authenticate to GitHub Container Registry.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the Dockerfile and publish the finished image to GHCR.
      - name: Build and push development image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/cnguye-n/swot-internal-wave-ml-yolo:development

          # Cache Docker build layers between GitHub Actions runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max